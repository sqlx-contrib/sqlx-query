name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No database service: the tests compare the SQL these crates render, so
      # the PostgreSQL, MySQL and SQLite coverage is over the text produced
      # rather than over what a server does with it.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Setup Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: disabled
          use-gha-cache: enabled

      - name: Run Lint
        run: nix develop --command make lint

      - name: Run Tests
        run: nix develop --command make test

      - name: Check Documentation
        run: nix develop --command make doc-check

  release:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Both crates in one release PR, moving to the same version together
      # (the `linked-versions` plugin in the config), because sqlx-query-cel
      # pins an exact sqlx-query -- a release where only one of them moved
      # would publish a crate depending on a version that does not exist yet.
      - name: Create Release PR
        id: release
        uses: googleapis/release-please-action@v5
        with:
          manifest-file: .github/config/release-please-manifest.json
          config-file: .github/config/release-please-config.json
          target-branch: main

  # No `build` job: these are library crates with no binary, so there is
  # nothing to `nix build` and no asset to attach to the release. The crates
  # themselves are the artifact, and they go to crates.io below.
  publish:
    needs: release
    if: ${{ needs.release.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Setup Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: disabled
          use-gha-cache: enabled

      - name: Authenticate with Crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # `--workspace` rather than two `cargo publish` calls: it walks the
      # dependency graph, so sqlx-query goes up first and sqlx-query-cel waits
      # for it to appear in the index instead of failing to resolve it.
      - name: Publish to Crates.io
        run: nix develop --command cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
