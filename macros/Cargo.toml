[package]
name = "sqlx-query-macros"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "Derive macros for sqlx-query."
repository = "https://github.com/sqlx-contrib/sqlx-query"
keywords = ["sqlx", "sql", "query", "macros"]
categories = ["database"]

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
