[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sqlx-contrib/sqlx-query-v2"

[workspace.dependencies]
sqlx = { version = "0.9", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
regex = "1"
thiserror = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
# The filter syntax only. `default-features = false` drops the interpreter's
# regex/chrono support: this parses CEL and never evaluates it.
cel = { version = "0.14", default-features = false }
