[workspace]
members = ["core", "macros"]

# Shared by both crates: a lint this one tolerates is a lint its consumers
# cannot, and several in this ecosystem deny pedantic at the workspace level.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[package]
name = "sqlx-query"
version = "0.0.0"
edition = "2024"
# Not a choice: sqlx 0.9 declares it. 0.9 is the floor because `SqlStr` is what
# makes a rewritten query expressible at all -- in 0.8 `Execute::sql()` returned
# `&'q str`, so spliced SQL had nowhere to live.
rust-version = "1.94"
license = "MIT"
description = "Splices SQL fragments into the sentinel comments of a query you already wrote, for sqlx."
repository = "https://github.com/sqlx-contrib/sqlx-query"
keywords = ["sqlx", "sql", "query", "postgres", "pagination"]
categories = ["database"]

[lints]
workspace = true

[dependencies]
# Not optional: `Value::Timestamp` is unconditional, and there is no build of
# this crate that avoids it -- a cursor over a `created_at` column is the
# common case, not an edge one.
# Page tokens travel in URLs, so they are base64url with no padding: `+`, `/`
# and `=` all need escaping somewhere along the way, and something in the chain
# eventually forgets.
base64 = "0.22"
# Optional: only `Predicate::parse` needs a CEL parser, and a caller who
# paginates without filtering should not compile one.
#
# `chrono` is the only cel feature wanted here, and not for the parser --
# nothing under cel's parser is gated. It is what lets `timestamp('...')` fold
# into a bind value. `regex` is deliberately off: `matches()` always has a
# column on one side, so it never folds, and it lowers to the dialect's own
# operator instead.
cel = { version = "0.14", default-features = false, features = [
  "chrono",
], optional = true }
sqlx-query-core = { version = "0.0.0", path = "core" }
sqlx-query-macros = { version = "0.0.0", path = "macros", optional = true }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
sqlx = { version = "0.9", default-features = false }

[features]
default = ["postgres", "macros"]

# Driver support. At least one is required: without a driver there is no
# `Arguments` impl to splice against.
postgres = ["sqlx/postgres", "sqlx/chrono"]
sqlite = ["sqlx/sqlite", "sqlx/chrono"]
mysql = ["sqlx/mysql", "sqlx/chrono"]

# CEL filters.
cel = ["dep:cel"]

# `sql!`, so a skeleton is scanned at compile time and lives in a `static`.
macros = ["dep:sqlx-query-macros"]

[dev-dependencies]
sqlx = { version = "0.9", default-features = false, features = [
  "postgres",
  "sqlite",
  "mysql",
  "chrono",
  "runtime-tokio",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
