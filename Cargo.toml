[package]
name = "sqlx-query"
version = "0.0.0"
edition = "2024"
# Not a choice: sqlx 0.9 declares it. 0.9 is the floor because `SqlStr` is what
# makes a rewritten query expressible at all -- in 0.8 `Execute::sql()` returned
# `&'q str`, so a query rendered at runtime had nowhere to live.
rust-version = "1.94"
license = "MIT"
description = "Adds filters and ordering to a SQL query you already wrote, by rewriting its syntax tree, for sqlx."
repository = "https://github.com/sqlx-contrib/sqlx-query"
keywords = ["sqlx", "sql", "query", "postgres", "pagination"]
categories = ["database"]

# Denied rather than warned, to match the rest of this ecosystem: a lint this
# crate tolerates is a lint its consumers cannot.
[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[dependencies]
# The whole premise. Fragments are parsed rather than concatenated, so a
# fragment that is not a single complete expression is rejected at the boundary
# instead of reaching the database.
#
# `visitor` is what makes placeholder renumbering a tree walk rather than a
# scan over text -- a scan has to know which `$1` sits inside a string literal,
# and a walk cannot see one in the first place.
sqlparser = { version = "0.63", features = ["visitor"] }
sqlx = { version = "0.9", default-features = false }

# Optional: only `Filter` needs a CEL parser, and a query that only sorts
# should not compile one.
#
# Only the parser is wanted, not the evaluator: this crate reads the CEL
# syntax tree itself, so none of cel's own value handling is used.
cel = { version = "0.14", default-features = false, optional = true }

# Optional: what `timestamp('...')` in a filter folds into. Left out, that call
# is simply one the filter language does not have.
chrono = { version = "0.4", default-features = false, features = [
  "alloc",
], optional = true }

[features]
default = ["postgres"]

# Driver support. At least one is required: without a driver there is no
# `Arguments` impl to bind against.
#
# Both of these name the value a placeholder binds -- `$N` and `?N` -- which is
# what lets a fragment be spliced into the middle of a query without disturbing
# what comes after it. MySQL has only a bare `?`, which does not, so it is left
# out rather than made to work by reordering the values behind your back.
postgres = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite"]

# CEL filters.
cel = ["dep:cel"]

# `timestamp('...')` in a filter, and the date type it binds as.
chrono = ["dep:chrono", "sqlx/chrono"]

[dev-dependencies]
sqlx = { version = "0.9", default-features = false, features = [
  "postgres",
  "sqlite",
  "runtime-tokio",
  # Only the tests need `derive(FromRow)`. The crate itself is macro-free, and
  # takes sqlx with no default features so a consumer is not made to compile
  # one.
  "macros",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Shows the same code against both drivers, so it needs both. Without this the
# per-driver lint pass tries to build it with one and fails.
[[example]]
name = "listing"
required-features = ["postgres", "sqlite"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
