[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
# No `version` here on purpose: each crate carries a literal one instead of
# inheriting, because release-please's cargo-workspace plugin cannot read
# `version.workspace = true` -- it reports "package manifest has an invalid
# [package.version]" and releases nothing
# (googleapis/release-please#2111). The `linked-versions` plugin is what keeps
# the two literals in step, so they still move together.
edition = "2021"
license = "MIT"
repository = "https://github.com/sqlx-contrib/sqlx-query"

# Denied rather than warned, to match the rest of this ecosystem: a lint these
# crates tolerate is a lint their consumers cannot. `priority = -1` lets an
# individual `allow` in a crate override the group.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[workspace.dependencies]
sqlx = { version = "0.9", default-features = false }
chrono = { version = "0.4", default-features = false }
time = { version = "0.3", default-features = false }
uuid = { version = "1", default-features = false }
regex = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
# The filter syntax only. `default-features = false` drops the interpreter's
# regex/chrono support: this parses CEL and never evaluates it.
cel = { version = "0.14", default-features = false }
