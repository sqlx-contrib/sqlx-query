[package]
name = "sqlx-query"
version = "0.0.0"
edition = "2024"
# Not a choice: sqlx 0.9 declares it. 0.9 is the floor because `SqlStr` is what
# makes a rewritten query expressible at all -- in 0.8 `Execute::sql()` returned
# `&'q str`, so spliced SQL had nowhere to live.
rust-version = "1.94"
license = "MIT"
description = "Splices SQL fragments into the sentinel comments of a query you already wrote, for sqlx."
repository = "https://github.com/sqlx-contrib/sqlx-query"
keywords = ["sqlx", "sql", "query", "postgres", "pagination"]
categories = ["database"]

# Denied rather than warned, to match the rest of this ecosystem: a lint this
# crate tolerates is a lint its consumers cannot.
[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[dependencies]
# Not optional: `Value::Timestamp` is unconditional, and there is no build of
# this crate that avoids it -- a cursor over a `created_at` column is the
# common case, not an edge one.
# Page tokens travel in URLs, so they are base64url with no padding: `+`, `/`
# and `=` all need escaping somewhere along the way, and something in the chain
# eventually forgets.
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
sqlx = { version = "0.9", default-features = false }

[features]
default = ["postgres"]

# Driver support. At least one is required: without a driver there is no
# `Arguments` impl to splice against.
postgres = ["sqlx/postgres", "sqlx/chrono"]
sqlite = ["sqlx/sqlite", "sqlx/chrono"]
mysql = ["sqlx/mysql", "sqlx/chrono"]

[dev-dependencies]
sqlx = { version = "0.9", default-features = false, features = [
  "postgres",
  "sqlite",
  "mysql",
  "chrono",
] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
