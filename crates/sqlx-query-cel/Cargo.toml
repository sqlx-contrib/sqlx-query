[package]
name = "sqlx-query-cel"
description = "Reads an AIP-160 filter written in CEL into a sqlx-query WhereClause"
version = "1.0.0" # literal, not inherited -- see [workspace.package]
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["sql", "sqlx", "cel", "filter", "aip-160"]
categories = ["database"]

[lints]
workspace = true

[features]
# Nothing by default, as in sqlx-query. A date library, for reading
# `timestamp("...")` into a timestamp bind value; each turns on sqlx-query's
# own feature of the same name, which is what binds one.
default = []
chrono = ["dep:chrono", "sqlx-query/chrono"]
time = ["dep:time", "sqlx-query/time"]
# `uuid("...")`, read into a UUID bind value, so a filter compares with a
# `uuid` column.
uuid = ["dep:uuid", "sqlx-query/uuid"]

[dependencies]
# `version` alongside `path` because `cargo publish` refuses a path
# dependency without one -- the published crate has no sibling directory to
# resolve, only a registry. release-please's cargo-workspace plugin keeps this
# in step with sqlx-query's own version.
sqlx-query = { path = "../sqlx-query", version = "1.0.0", default-features = false }
cel = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true, optional = true }
time = { workspace = true, optional = true, features = ["parsing"] }
uuid = { workspace = true, optional = true }

[dev-dependencies]
# A runtime and two drivers, only for the tests that run a filter against a
# real engine: whether a pattern's escapes mean what the SQL text says is the
# driver's call, which comparing rendered text cannot check.
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "postgres"] }
sqlx-query = { path = "../sqlx-query", features = ["sqlite", "postgres"] }
tokio = { workspace = true }
