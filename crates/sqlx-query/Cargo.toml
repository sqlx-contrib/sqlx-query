[package]
name = "sqlx-query"
description = "Filtering, ordering and keyset pagination spliced into SQL you already wrote, for sqlx"
version = "1.0.0" # literal, not inherited -- see [workspace.package]
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["sql", "sqlx", "pagination", "filter", "keyset"]
categories = ["database"]

[lints]
workspace = true

[features]
# Nothing by default. A consumer names the driver they use and the date
# library they already have, and compiles neither of the others.
default = []
postgres = ["sqlx/postgres"]
mysql = ["sqlx/mysql"]
sqlite = ["sqlx/sqlite"]
# A date library, for reading a timestamp out of a row and binding one back.
# `Value::Timestamp` exists either way -- see its docs for why it has to.
chrono = ["dep:chrono", "sqlx/chrono"]
time = ["dep:time", "sqlx/time"]
# UUIDs bound and read back as `uuid::Uuid`, so a filter can compare with a
# `uuid` column and a cursor can page on a UUID key. `Value::Uuid` exists
# either way, for the same reason `Value::Timestamp` does.
uuid = ["dep:uuid", "sqlx/uuid"]

[dependencies]
sqlx = { workspace = true }
chrono = { workspace = true, optional = true }
time = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
regex = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }

[dev-dependencies]
# A runtime, and the drivers, only for the tests: the library itself never
# opens a connection. `runtime-tokio` is additive, so enabling it here does
# not change what a consumer of the library gets.
sqlx = { workspace = true, features = ["runtime-tokio"] }
tokio = { workspace = true }
uuid = { workspace = true }

# The full matrix, so `cargo test` covers every dialect and both date
# libraries without anyone having to remember a `--features` flag.
[package.metadata.docs.rs]
all-features = true
