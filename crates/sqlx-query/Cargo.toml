[package]
name = "sqlx-query"
description = "Filtering, ordering and keyset pagination spliced into SQL you already wrote, for sqlx"
version = "0.1.0" # literal, not inherited -- see [workspace.package]
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["sql", "sqlx", "pagination", "filter", "keyset"]
categories = ["database"]

[lints]
workspace = true

[dependencies]
sqlx = { workspace = true, features = ["postgres", "mysql", "sqlite", "chrono"] }
chrono = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }

[dev-dependencies]
# A runtime, and the drivers, only for the tests: the library itself never
# opens a connection. `runtime-tokio` is additive, so enabling it here does
# not change what a consumer of the library gets.
sqlx = { workspace = true, features = [
  "runtime-tokio",
  "postgres",
  "mysql",
  "sqlite",
  "chrono",
] }
tokio = { workspace = true }
